name: Check

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Assets, Hugo, browsers, and PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
          python-version: 3.14.6
          activate-environment: true
          version: 0.11.29

      - name: Install Hugo Extended 0.164.0
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/hugo_extended_0.164.0_linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.tar.gz" \
            --output "${archive}"
          echo "fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4  ${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" hugo
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 "${RUNNER_TEMP}/hugo" "${RUNNER_TEMP}/bin/hugo"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          bun --version
          uv --version
          python --version
          hugo version
          test "$(bun --version)" = "1.3.14"
          uv --version | grep --extended-regexp --quiet '^uv 0[.]11[.]29([[:space:]]|$)'
          test "$(python --version)" = "Python 3.14.6"
          hugo version | grep --extended-regexp --quiet '^hugo v0[.]164[.]0(-[0-9a-f]+)?[+]extended([+[:space:]]|$)'

      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          uv sync --locked
          bunx playwright install --with-deps chromium firefox webkit

      - name: Run complete verification
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo-cache
        run: bun run check

      - name: Upload browser and PDF diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cvnewtheme-verification-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            tmp/pdfs/
          if-no-files-found: ignore
          retention-days: 7
